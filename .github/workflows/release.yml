# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet — see the comment in ci.yml for what that action cost on 2026-08-17.
name: Release

# Stable channel. Runs on an annotated tag vX.Y.Z; a tag that does not match is ignored.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The identifier is what makes the archive hold what its name says. Without it every
      # platform got the same portable build and the name was a label, not a fact.
      - name: Publish toolchain
        run: >
          dotnet msbuild build/publish.proj
          -p:PublishRoot=${{ github.workspace }}/out
          -p:Rid=${{ matrix.rid }}

      - name: Archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="lyric-${version}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/${name}.zip" "./out/*"
          else
            tar -czf "dist/${name}.tar.gz" -C out .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  extension:
    name: Package (vscode)
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # vsce stops on a missing LICENSE with a prompt no CI can answer; the repository's license
      # covers the extension and travels into the package.
      - name: Package extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp LICENSE tooling/vscode-lyric/LICENSE
          cd tooling/vscode-lyric
          npm install --omit=dev
          npx --yes @vscode/vsce package --out "../../dist/vscode-lyric-${version}.vsix"

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: dist-vscode
          path: dist/*
          retention-days: 7

  publish:
    name: Publish release
    needs: [package, extension]
    runs-on: ubuntu-latest

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
