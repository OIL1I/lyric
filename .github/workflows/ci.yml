# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet.
#
# Every job that used the action downloaded its archive from codeload and then a 240 MB SDK. On
# 2026-08-17 that download returned 429 and 503 eight times across the workflows, three of them
# during a release, each time failing in "Set up job" before anything was built. Nothing in this
# repository could retry its way out of it.
#
# global.json states the version, so a runner without a matching SDK fails with a message that says
# so rather than with a target-framework error further along.
name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7

  jetbrains-plugin:
    # The one non-.NET build in the suite. It lives in CI rather than only in the release so a
    # platform or Kotlin break is a red push, not a red release tag. Gradle caches the IntelliJ
    # platform dependency, so the recurring cost is minutes, not the first run's download.
    name: Build JetBrains plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        working-directory: tooling/jetbrains-lyric
        run: ./gradlew buildPlugin verifyPluginStructure

  publish:
    # Runs after the tests so no artifact is produced from a red build.
    name: Publish toolchain
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish all four binaries into one directory
        run: dotnet msbuild build/publish.proj

      - name: Show what gets shipped
        run: ls -la artifacts/publish

      - name: Upload toolchain
        uses: actions/upload-artifact@v7
        with:
          name: lyric-toolchain
          path: artifacts/publish
          retention-days: 14
