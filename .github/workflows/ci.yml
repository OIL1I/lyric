# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet.
#
# Every job that used the action downloaded its archive from codeload and then a 240 MB SDK. On
# 2026-08-17 that download returned 429 and 503 eight times across the workflows, three of them
# during a release, each time failing in "Set up job" before anything was built. Nothing in this
# repository could retry its way out of it.
#
# global.json states the version, so a runner without a matching SDK fails with a message that says
# so rather than with a target-framework error further along.
name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7

  spec-sync:
    # docs/Grammar.md and docs/Bytecode.md are MIRRORS of the spec repository's chapters 02
    # and 13: everything below the '<!-- sync:body -->' marker must be byte-identical. This
    # job is what makes the mirror model honest — drift fails the build instead of shipping.
    name: Spec mirror sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the specification
        uses: actions/checkout@v7
        with:
          repository: lyriclang/lyric-spec
          path: spec-repo

      - name: Diff the mirrored bodies
        run: |
          status=0
          check() {
            sed -n '/^<!-- sync:body -->$/,$p' "$1" > /tmp/mirror.txt
            sed -n '/^<!-- sync:body -->$/,$p' "$2" > /tmp/canonical.txt
            if ! diff -u /tmp/canonical.txt /tmp/mirror.txt; then
              echo "::error file=$1::mirror drifted from $2"
              status=1
            fi
          }
          check docs/Grammar.md  spec-repo/spec/02-grammar.md
          check docs/Bytecode.md spec-repo/spec/13-bytecode.md
          exit "$status"

  publish:
    # Runs after the tests so no artifact is produced from a red build.
    name: Publish toolchain
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish all four binaries into one directory
        run: dotnet msbuild build/publish.proj

      - name: Show what gets shipped
        run: ls -la artifacts/publish

      - name: Upload toolchain
        uses: actions/upload-artifact@v7
        with:
          name: lyric-toolchain
          path: artifacts/publish
          retention-days: 14
