# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet — see the comment in ci.yml for what that action cost on 2026-08-17.
name: Nightly

# Dev channel. Builds the current main once a day and replaces the 'nightly' prerelease.
# workflow_dispatch triggers the same run on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The identifier is what makes the archive hold what its name says. Without it every
      # platform got the same portable build and the name was a label, not a fact.
      - name: Publish toolchain
        run: >
          dotnet msbuild build/publish.proj
          -p:PublishRoot=${{ github.workspace }}/out
          -p:Rid=${{ matrix.rid }}

      # Same gate as the release: the published toolchain packs an example and the result runs.
      - name: Pack and run an example
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then lyric=out/lyric.exe; packed=hello.exe
          else lyric=out/lyric; packed=hello; fi
          "$lyric" pack examples/hello.lyr -o "$packed"
          if [ "${{ runner.os }}" = "macOS" ]; then codesign --force --sign - "$packed"; fi
          "./$packed"

      - name: Archive
        shell: bash
        run: |
          name="lyric-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/${name}.zip" "./out/*"
          else
            tar -czf "dist/${name}.tar.gz" -C out .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish nightly
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # One moving tag, one prerelease. The tag is forced onto the current commit so the
      # 'nightly' release always points at what was built.
      - name: Move the nightly tag
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

      - name: Replace the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create nightly dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nightly ($(date -u +%Y-%m-%d))" \
            --notes "Automated build of main at ${GITHUB_SHA::7}. Unstable: no compatibility promise." \
            --prerelease
